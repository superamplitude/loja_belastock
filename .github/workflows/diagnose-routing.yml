name: Diagnose Bela Stock Routing

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: belastock-routing-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect PHP FPM and vhosts
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="loja.belastock.com.br"
          DOCROOT="/home/belastock/htdocs/${DOMAIN}"
          echo '=== PORTS PHP/FPM ==='
          ss -lntp | grep -Ei 'php|fpm|:90[0-9][0-9]|:92[0-9][0-9]' || true
          ss -lxnp | grep -Ei 'php|fpm' || true
          echo '=== FPM POOLS ==='
          find /etc/php -path '*/fpm/pool.d/*' -type f -maxdepth 6 -print 2>/dev/null | sort | while read -r f; do
            echo "--- $f"
            grep -nE '^\[|^[[:space:]]*user[[:space:]]*=|^[[:space:]]*group[[:space:]]*=|^[[:space:]]*listen[[:space:]]*=|^[[:space:]]*listen\.(owner|group|mode)' "$f" | head -40 || true
          done
          echo '=== PHP BINARIES ==='
          php -v | head -2 || true
          for v in 8.1 8.2 8.3 8.4 8.5; do test -x "/usr/bin/php$v" && "/usr/bin/php$v" -v | head -1; done
          echo '=== CLOUDPANEL CLI HELP ==='
          clpctl 2>&1 | head -120 || true
          echo '=== VHOSTS WITH WORDPRESS/PHP ==='
          for f in /etc/nginx/sites-enabled/*.conf; do
            if grep -q 'fastcgi_pass' "$f"; then
              echo "--- $f"
              grep -nE 'server_name|root |index |try_files|fastcgi_pass|fastcgi_param SCRIPT_FILENAME|include.*fastcgi' "$f" | head -100
            fi
          done
          echo '=== CURRENT VHOST ==='
          cat "/etc/nginx/sites-enabled/${DOMAIN}.conf"
          echo '=== CURRENT WP ==='
          sudo -u belastock -H wp --path="$DOCROOT" core version
          sudo -u belastock -H wp --path="$DOCROOT" option get permalink_structure || true
          echo -n 'published_products='; sudo -u belastock -H wp --path="$DOCROOT" post list --post_type=product --post_status=publish --format=count || true; echo
