name: Fix Store Archive Layout V1
on:
  push:
    paths:
      - '.github/workflows/fix-store-archive-layout-v1.yml'
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Rebuild WooCommerce archive layout
        shell: bash
        run: |
          set -Eeuo pipefail
          DOCROOT='/home/belastock/htdocs/loja.belastock.com.br'
          THEME="$DOCROOT/wp-content/themes/belastock-store"
          WC_DIR="$THEME/woocommerce"
          TEMPLATE="$WC_DIR/archive-product.php"
          CSS="$THEME/assets/pro-v4.css"
          STAMP="$(date +%Y%m%d_%H%M%S)"
          BACKUP="/home/belastock/backups/theme/archive-layout-v1-$STAMP"
          mkdir -p "$BACKUP" "$WC_DIR"
          [ -f "$TEMPLATE" ] && cp -a "$TEMPLATE" "$BACKUP/archive-product.php.before" || true
          cp -a "$CSS" "$BACKUP/pro-v4.css.before"
          echo "BACKUP=$BACKUP"

          cat > "$TEMPLATE" <<'PHP'
          <?php
          /**
           * Bela Stock — arquivo profissional de produtos/categorias.
           * Mantido no tema para impedir o fallback genérico com sidebar.
           */
          defined('ABSPATH') || exit;
          get_header('shop');

          $term = is_product_taxonomy() ? get_queried_object() : null;
          $title = woocommerce_page_title(false);
          $description = '';
          if ($term instanceof WP_Term) {
              $description = term_description($term, $term->taxonomy);
          }
          ?>
          <main id="primary" class="bs-shop-archive" role="main">
              <div class="bs-wrap bs-shop-archive__inner">
                  <div class="bs-shop-archive__crumbs"><?php woocommerce_breadcrumb(); ?></div>

                  <header class="bs-shop-archive__hero">
                      <div>
                          <span class="bs-shop-archive__eyebrow">Bela Stock</span>
                          <?php if (woocommerce_show_page_title()) : ?>
                              <h1 class="bs-shop-archive__title"><?php echo esc_html($title); ?></h1>
                          <?php endif; ?>
                          <?php if ($description) : ?>
                              <div class="bs-shop-archive__description"><?php echo wp_kses_post($description); ?></div>
                          <?php else : ?>
                              <p class="bs-shop-archive__description">Escolha seu modelo e personalize com a identidade da Bela Stock.</p>
                          <?php endif; ?>
                      </div>
                      <a class="bs-shop-archive__all" href="<?php echo esc_url(wc_get_page_permalink('shop')); ?>">Ver todos os produtos</a>
                  </header>

                  <?php if (woocommerce_product_loop()) : ?>
                      <section class="bs-shop-archive__catalog" aria-label="Catálogo de produtos">
                          <div class="bs-shop-archive__toolbar">
                              <?php do_action('woocommerce_before_shop_loop'); ?>
                          </div>

                          <?php woocommerce_product_loop_start(); ?>
                          <?php if (wc_get_loop_prop('total')) : ?>
                              <?php while (have_posts()) : the_post(); ?>
                                  <?php do_action('woocommerce_shop_loop'); ?>
                                  <?php wc_get_template_part('content', 'product'); ?>
                              <?php endwhile; ?>
                          <?php endif; ?>
                          <?php woocommerce_product_loop_end(); ?>

                          <?php do_action('woocommerce_after_shop_loop'); ?>
                      </section>
                  <?php else : ?>
                      <section class="bs-shop-empty" aria-label="Categoria sem produtos">
                          <div class="bs-shop-empty__icon" aria-hidden="true">◇</div>
                          <h2>Esta categoria está sendo preparada</h2>
                          <p>Ainda não há produtos publicados aqui. Você pode continuar navegando pelo catálogo completo.</p>
                          <a class="bs-shop-empty__button" href="<?php echo esc_url(wc_get_page_permalink('shop')); ?>">Ver todos os produtos</a>
                      </section>
                  <?php endif; ?>
              </div>
          </main>
          <?php get_footer('shop'); ?>
          PHP

          python3 - "$CSS" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          css=p.read_text()
          marker='/* BS_SHOP_ARCHIVE_V1 */'
          block=r'''
          /* BS_SHOP_ARCHIVE_V1 */
          body.post-type-archive-product,body.tax-product_cat,body.tax-product_tag{background:#f7f5f8}
          .bs-shop-archive{padding:34px 0 72px;min-height:520px;background:linear-gradient(180deg,#fff 0,#faf8fb 210px,#f7f5f8 100%)}
          .bs-shop-archive__inner{display:block}
          .bs-shop-archive__crumbs{margin:0 0 18px;color:#817886;font-size:12px;font-weight:650}
          .bs-shop-archive__crumbs .woocommerce-breadcrumb{margin:0!important;color:inherit!important;font-size:inherit!important}
          .bs-shop-archive__crumbs a{color:#5f5663}.bs-shop-archive__crumbs a:hover{color:var(--purple)}
          .bs-shop-archive__hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin:0 0 26px;padding:30px 34px;border:1px solid #ebe4ed;border-radius:22px;background:#fff;box-shadow:0 12px 35px rgba(54,34,60,.06)}
          .bs-shop-archive__eyebrow{display:block;margin-bottom:7px;color:var(--purple);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
          .bs-shop-archive__title{margin:0;color:#171319;font-size:clamp(2rem,4vw,3.6rem);line-height:.95;letter-spacing:-.045em}
          .bs-shop-archive__description{max-width:700px;margin:12px 0 0;color:#706875;font-size:15px;line-height:1.65}
          .bs-shop-archive__description p{margin:0}
          .bs-shop-archive__all,.bs-shop-empty__button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:999px;background:var(--purple-dark);color:#fff!important;font-size:13px;font-weight:850;white-space:nowrap;transition:transform .15s ease,box-shadow .15s ease}
          .bs-shop-archive__all:hover,.bs-shop-empty__button:hover{transform:translateY(-1px);box-shadow:0 9px 18px rgba(75,28,87,.18)}
          .bs-shop-archive__catalog{padding:22px 0 0}
          .bs-shop-archive__toolbar{min-height:42px;margin-bottom:18px}
          .bs-shop-archive__toolbar .woocommerce-result-count{margin:10px 0;color:#756d79;font-size:13px}
          .bs-shop-archive__toolbar .woocommerce-ordering{margin:0}
          .bs-shop-archive__toolbar select{min-height:42px;padding:0 38px 0 13px;border:1px solid #ded7e1;border-radius:12px;background:#fff;color:#332d35}
          .bs-shop-archive .woocommerce ul.products,.bs-shop-archive ul.products{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px!important;margin:0!important;padding:0!important}
          .bs-shop-archive ul.products:before,.bs-shop-archive ul.products:after{display:none!important}
          .bs-shop-archive ul.products li.product{float:none!important;width:auto!important;margin:0!important;padding:12px!important;border:1px solid #ebe5ed;border-radius:18px!important;background:#fff!important;box-shadow:0 4px 18px rgba(37,28,40,.05)!important;transition:transform .18s ease,box-shadow .18s ease}
          .bs-shop-archive ul.products li.product:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(37,28,40,.09)!important}
          .bs-shop-archive ul.products li.product a img{margin:0 0 12px!important;border-radius:13px!important;aspect-ratio:1/1.12;object-fit:cover;background:#f2eff3}
          .bs-shop-archive ul.products li.product .woocommerce-loop-product__title{padding:0!important;margin:0 0 7px!important;color:#211b23;font-size:15px!important;line-height:1.35}
          .bs-shop-archive ul.products li.product .price{margin:0 0 12px!important;color:var(--purple-dark)!important;font-size:15px!important;font-weight:900!important}
          .bs-shop-archive ul.products li.product .button{margin-top:2px!important;min-height:38px!important;padding:9px 14px!important;font-size:12px!important}
          .bs-shop-empty{display:grid;place-items:center;max-width:820px;margin:28px auto 0;padding:54px 28px;text-align:center;border:1px solid #e7dfea;border-radius:24px;background:#fff;box-shadow:0 12px 35px rgba(54,34,60,.05)}
          .bs-shop-empty__icon{display:grid;place-items:center;width:64px;height:64px;margin-bottom:14px;border-radius:50%;background:#f3eaf5;color:var(--purple);font-size:28px;font-weight:900}
          .bs-shop-empty h2{margin:0 0 8px;color:#211a23;font-size:clamp(1.45rem,3vw,2.15rem);letter-spacing:-.025em}
          .bs-shop-empty p{max-width:560px;margin:0 0 20px;color:#746b77;line-height:1.65}
          body.post-type-archive-product #sidebar,body.tax-product_cat #sidebar,body.tax-product_tag #sidebar{display:none!important}
          @media(max-width:1024px){.bs-shop-archive ul.products{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
          @media(max-width:760px){.bs-shop-archive{padding:22px 0 48px}.bs-shop-archive__hero{align-items:flex-start;flex-direction:column;padding:24px}.bs-shop-archive__all{width:100%}.bs-shop-archive ul.products{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important}.bs-shop-empty{padding:40px 20px}}
          @media(max-width:480px){.bs-shop-archive ul.products{grid-template-columns:1fr!important}.bs-shop-archive__hero{padding:20px;border-radius:16px}.bs-shop-empty{border-radius:18px}}
          '''
          if marker in css:
              css=css.split(marker,1)[0].rstrip()+"\n\n"+block.lstrip()
          else:
              css=css.rstrip()+"\n\n"+block.lstrip()
          p.write_text(css)
          PY

          chown belastock:belastock "$TEMPLATE" "$CSS"
          php -l "$TEMPLATE"

          sudo -u belastock -H wp --path="$DOCROOT" cache flush >/dev/null 2>&1 || true
          if command -v redis-cli >/dev/null 2>&1; then redis-cli FLUSHDB >/dev/null 2>&1 || true; fi

          URL='https://loja.belastock.com.br/categoria-produto/manga-longa/'
          CODE="$(curl -kLsS --max-time 30 -o /tmp/manga-fixed.html -w '%{http_code}' "$URL")"
          echo "HTTP=$CODE"
          test "$CODE" = 200
          grep -q 'class="bs-shop-archive"' /tmp/manga-fixed.html
          grep -q 'class="bs-shop-empty"' /tmp/manga-fixed.html
          ! grep -q '<div id="sidebar"' /tmp/manga-fixed.html
          grep -q 'BS_SHOP_ARCHIVE_V1' "$CSS"
          echo 'ARCHIVE_LAYOUT_V1=OK'
