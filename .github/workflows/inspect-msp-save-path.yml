name: Inspect MSP Save Path

on:
  push:
    branches: [main]
    paths:
      - '.msp-save-path-trigger'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Inspect AJAX save, JS handlers and product meta
        shell: bash
        run: |
          set -Eeuo pipefail
          DOCROOT='/home/belastock/htdocs/loja.belastock.com.br'
          PHP="$DOCROOT/wp-content/plugins/mockup-studio-pro/includes/class-msp-plugin.php"
          JS="$DOCROOT/wp-content/plugins/mockup-studio-pro/assets/js/editor.js"
          echo '=== AJAX SAVE PHP ==='
          grep -n -A 90 -B 10 "function ajax_save_config" "$PHP" | head -n 140 || true
          echo '=== AJAX HOOK ==='
          grep -n -C 3 "msp_save_config" "$PHP" | head -n 80 || true
          echo '=== LOCALIZE ==='
          grep -n -A 35 -B 5 "wp_localize_script('msp-editor'" "$PHP" | head -n 80 || true
          echo '=== JS PERSIST ==='
          grep -n -A 30 -B 10 "function persistConfig" "$JS" | head -n 80 || true
          echo '=== JS REMOVE HANDLER ==='
          grep -n -A 35 -B 15 "msp-model-remove-base" "$JS" | tail -n 120 || true
          echo '=== PLUGIN BOOT ==='
          tail -n 80 "$PHP"
          echo '=== PRODUCT 27 META ==='
          sudo -u belastock -H wp --path="$DOCROOT" eval '$c=get_post_meta(27,"_msp_config",true); echo wp_json_encode($c,JSON_PRETTY_PRINT|JSON_UNESCAPED_SLASHES)."\n";'
