name: Restore Bela Stock WordPress Routing

on:
  push:
    branches: [main]
    paths:
      - '.restore-wordpress-trigger'
  workflow_dispatch:

concurrency:
  group: belastock-wordpress-routing
  cancel-in-progress: true

jobs:
  restore:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Restore nginx vhost to WordPress
        shell: bash
        run: |
          set -Eeuo pipefail
          DOMAIN="loja.belastock.com.br"
          DOCROOT="/home/belastock/htdocs/${DOMAIN}"
          VHOST="/etc/nginx/sites-enabled/${DOMAIN}.conf"
          BACKUP="/root/BELASTOCK_BRIDGE_BACKUPS/${DOMAIN}-before-wordpress-$(date +%Y%m%d_%H%M%S).conf"

          test -d "$DOCROOT"
          test -f "$DOCROOT/wp-config.php"
          sudo -u belastock -H wp --path="$DOCROOT" core is-installed
          sudo -u belastock -H wp --path="$DOCROOT" core version

          mkdir -p "$(dirname "$BACKUP")"
          cp -a "$VHOST" "$BACKUP"
          echo "VHOST_BACKUP=$BACKUP"

          cat > "$VHOST" <<'NGINX'
server {
  listen 80;
  listen [::]:80;
  server_name loja.belastock.com.br;
  return 301 https://loja.belastock.com.br$request_uri;
}

server {
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;

  ssl_certificate_key /etc/nginx/ssl-certificates/loja.belastock.com.br.key;
  ssl_certificate /etc/nginx/ssl-certificates/loja.belastock.com.br.crt;

  server_name loja.belastock.com.br;
  root /home/belastock/htdocs/loja.belastock.com.br;
  index index.php index.html index.htm;

  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  include /etc/nginx/global_settings;

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location = /favicon.ico { log_not_found off; access_log off; }
  location = /robots.txt  { log_not_found off; access_log off; allow all; }

  location ~ \.php$ {
    try_files $uri =404;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $document_root;
    fastcgi_param HTTPS on;
    fastcgi_param HTTP_PROXY "";
    fastcgi_read_timeout 300;
    fastcgi_pass 127.0.0.1:18001;
  }

  location ~* /(?:uploads|files)/.*\.php$ { deny all; }
  location ~ /\.(?!well-known).* { deny all; }
}
NGINX

          nginx -t
          systemctl reload nginx

      - name: Verify WordPress and admin access
        shell: bash
        run: |
          set -Eeuo pipefail
          DOMAIN="loja.belastock.com.br"
          DOCROOT="/home/belastock/htdocs/${DOMAIN}"

          HOME_CODE="$(curl -kLsS --max-redirs 5 --max-time 30 --resolve "${DOMAIN}:443:127.0.0.1" -o /tmp/bs-wp-home.html -w '%{http_code}' "https://${DOMAIN}/?wp-restore=$(date +%s)")"
          LOGIN_CODE="$(curl -kLsS --max-redirs 5 --max-time 30 --resolve "${DOMAIN}:443:127.0.0.1" -o /tmp/bs-wp-login.html -w '%{http_code}' "https://${DOMAIN}/wp-login.php?wp-restore=$(date +%s)")"
          ADMIN_CODE="$(curl -kLsS --max-redirs 0 --max-time 30 --resolve "${DOMAIN}:443:127.0.0.1" -o /tmp/bs-wp-admin.headers -D /tmp/bs-wp-admin.headers -w '%{http_code}' "https://${DOMAIN}/wp-admin/" || true)"

          echo "HOME_HTTP=$HOME_CODE"
          echo "WP_LOGIN_HTTP=$LOGIN_CODE"
          echo "WP_ADMIN_HTTP=$ADMIN_CODE"
          echo "WP_VERSION=$(sudo -u belastock -H wp --path="$DOCROOT" core version)"

          test "$HOME_CODE" = "200"
          test "$LOGIN_CODE" = "200"
          grep -q 'user_login' /tmp/bs-wp-login.html
          if ! [[ "$ADMIN_CODE" =~ ^(200|301|302)$ ]]; then
            echo "wp-admin indisponivel: HTTP=$ADMIN_CODE" >&2
            exit 1
          fi
          grep -q 'fastcgi_pass 127.0.0.1:18001' "/etc/nginx/sites-enabled/${DOMAIN}.conf"
          if grep -q 'proxy_pass http://127.0.0.1:3210' "/etc/nginx/sites-enabled/${DOMAIN}.conf"; then
            echo 'ERRO: reverse proxy Node ainda presente no vhost da loja' >&2
            exit 1
          fi

          echo 'LOJA_BELASTOCK_WORDPRESS=100%_OK'
          echo 'WP_ADMIN_URL=https://loja.belastock.com.br/wp-admin/'
