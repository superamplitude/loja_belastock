name: Audit Belastock Theme Parts
on:
  push:
    paths:
      - '.github/workflows/audit-belastock-theme-parts.yml'
jobs:
  audit:
    runs-on: self-hosted
    steps:
      - name: Inspect theme parts
        shell: bash
        run: |
          set -Eeuo pipefail
          T='/home/belastock/htdocs/loja.belastock.com.br/wp-content/themes/belastock-store'
          for f in index.php ui-v4.php single-product.php assets/pro-v4.css header.php footer.php; do
            echo "===== $f ====="
            sed -n '1,420p' "$T/$f" 2>/dev/null || true
          done
