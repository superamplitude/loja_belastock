name: Fix Mockup Studio Pro Media Upload

on:
  push:
    branches: [main]
    paths:
      - '.msp-media-fix-trigger'
  workflow_dispatch:

concurrency:
  group: belastock-msp-media-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Patch media hook safely and verify uploads
        shell: bash
        run: |
          set -Eeuo pipefail
          DOCROOT='/home/belastock/htdocs/loja.belastock.com.br'
          FILE="$DOCROOT/wp-content/plugins/mockup-studio-pro/includes/class-msp-image-optimizer.php"
          BACKUP="/home/belastock/backups/mockup-studio-pro/class-msp-image-optimizer.php.$(date +%Y%m%d_%H%M%S).bak"
          mkdir -p "$(dirname "$BACKUP")"
          test -f "$FILE"
          cp -a "$FILE" "$BACKUP"
          echo "BACKUP=$BACKUP"

          if grep -Fq 'public function check_svg_filetype(array $data, string $file, string $filename, array $mimes, $real_mime = null): array {' "$FILE"; then
            sed -i 's/public function check_svg_filetype(array $data, string $file, string $filename, array $mimes, $real_mime = null): array {/public function check_svg_filetype(array $data, string $file, string $filename, ?array $mimes = null, $real_mime = null): array {/' "$FILE"
            echo 'PATCH_APPLIED=YES'
          elif grep -Fq 'public function check_svg_filetype(array $data, string $file, string $filename, ?array $mimes = null, $real_mime = null): array {' "$FILE"; then
            echo 'PATCH_ALREADY_PRESENT=YES'
          else
            echo 'Assinatura esperada nao encontrada; abortando sem alterar.' >&2
            exit 1
          fi

          chown belastock:belastock "$FILE"
          chmod 0644 "$FILE"
          php8.3 -l "$FILE"
          grep -n 'function check_svg_filetype' "$FILE"
          systemctl reload php8.3-fpm || systemctl restart php8.3-fpm

          echo '=== TESTE JPEG 3000x1800 ==='
          TESTJPG=/tmp/belastock-media-fix-test-3000x1800.jpg
          php8.3 -r '$im=imagecreatetruecolor(3000,1800);$w=imagecolorallocate($im,255,255,255);imagefill($im,0,0,$w);imagejpeg($im,"/tmp/belastock-media-fix-test-3000x1800.jpg",88);imagedestroy($im);'
          JPG_RAW="$(sudo -u belastock -H wp --path="$DOCROOT" media import "$TESTJPG" --title='Bela Stock Media Fix JPG' --porcelain 2>/tmp/bs-media-fix-jpg.err)"
          JPG_ID="$(printf '%s\n' "$JPG_RAW" | grep -Eo '[0-9]+' | tail -n1)"
          echo "JPG_ATTACHMENT_ID=$JPG_ID"
          cat /tmp/bs-media-fix-jpg.err || true
          [[ "$JPG_ID" =~ ^[0-9]+$ ]]
          sudo -u belastock -H wp --path="$DOCROOT" post delete "$JPG_ID" --force >/dev/null 2>&1 || true
          rm -f "$TESTJPG"
          echo 'JPEG_UPLOAD=OK'

          echo '=== TESTE PNG 3000x1800 ==='
          TESTPNG=/tmp/belastock-media-fix-test-3000x1800.png
          php8.3 -r '$im=imagecreatetruecolor(3000,1800);$w=imagecolorallocate($im,245,245,255);imagefill($im,0,0,$w);imagepng($im,"/tmp/belastock-media-fix-test-3000x1800.png",6);imagedestroy($im);'
          PNG_RAW="$(sudo -u belastock -H wp --path="$DOCROOT" media import "$TESTPNG" --title='Bela Stock Media Fix PNG' --porcelain 2>/tmp/bs-media-fix-png.err)"
          PNG_ID="$(printf '%s\n' "$PNG_RAW" | grep -Eo '[0-9]+' | tail -n1)"
          echo "PNG_ATTACHMENT_ID=$PNG_ID"
          cat /tmp/bs-media-fix-png.err || true
          [[ "$PNG_ID" =~ ^[0-9]+$ ]]
          sudo -u belastock -H wp --path="$DOCROOT" post delete "$PNG_ID" --force >/dev/null 2>&1 || true
          rm -f "$TESTPNG"
          echo 'PNG_UPLOAD=OK'

          LOGIN_CODE="$(curl -kLsS --max-redirs 5 --max-time 20 --resolve 'loja.belastock.com.br:443:127.0.0.1' -o /dev/null -w '%{http_code}' 'https://loja.belastock.com.br/wp-login.php')"
          echo "WP_LOGIN_HTTP=$LOGIN_CODE"
          test "$LOGIN_CODE" = 200
          echo 'MEDIA_UPLOAD_FIX=100%_OK'
