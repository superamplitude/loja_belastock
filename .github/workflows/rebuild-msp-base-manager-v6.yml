name: Rebuild MSP Base Manager V6
on:
  push:
    branches: [main]
    paths:
      - '.rebuild-msp-base-manager-v6-trigger'
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 20
    steps:
      - name: Rebuild base manager inside VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/superamplitude/loja_belastock/main/deploy/rebuild-msp-base-manager-v6.sh' -o /tmp/rebuild-msp-base-manager-v6.sh
          chmod +x /tmp/rebuild-msp-base-manager-v6.sh
          bash /tmp/rebuild-msp-base-manager-v6.sh
