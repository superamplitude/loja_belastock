name: Fix MSP Color Picker V7
on:
  push:
    branches: [main]
    paths: ['.fix-msp-color-picker-v7']
  workflow_dispatch:
jobs:
  fix:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 15
    steps:
      - name: Apply color picker fix inside VPS
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/superamplitude/loja_belastock/main/deploy/fix-msp-color-picker-v7.sh' -o /tmp/fix-msp-color-picker-v7.sh
          chmod +x /tmp/fix-msp-color-picker-v7.sh
          bash /tmp/fix-msp-color-picker-v7.sh
