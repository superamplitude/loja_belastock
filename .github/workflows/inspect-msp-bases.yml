name: Fix Mockup Studio Pro Bases

on:
  push:
    branches: [main]
    paths:
      - '.msp-bases-inspect-trigger'
  workflow_dispatch:

concurrency:
  group: belastock-msp-bases-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: [self-hosted, belastock-loja]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Apply base manager fix
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/superamplitude/loja_belastock/main/deploy/fix-msp-base-manager.sh' -o /tmp/fix-msp-base-manager.sh
          chmod +x /tmp/fix-msp-base-manager.sh
          bash /tmp/fix-msp-base-manager.sh
